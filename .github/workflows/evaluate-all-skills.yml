name: Evaluate All Skills
on: workflow_dispatch

env:
  PASS_THRESHOLD: '80'

permissions:
  contents: read
  pull-requests: write

jobs:
  list-models:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.list.outputs.models }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Set fixed models for testing
        id: list
        run: |
          models='["claude-sonnet-4-6","claude-haiku-4-5-20251001"]'
          echo "models=$models" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$models" | jq length)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "Found ${{ steps.list.outputs.count }} models"

  discover:
    runs-on: ubuntu-latest
    outputs:
      all-skills: ${{ steps.discover.outputs.all-skills }}
      count: ${{ steps.discover.outputs.count }}
      skill-chunks: ${{ steps.discover.outputs.skill-chunks }}
      eval-skills: ${{ steps.discover.outputs.eval-skills }}
      eval-count: ${{ steps.discover.outputs.eval-count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Discover all skills
        id: discover
        run: |
          all=$(find plugins community-plugins -name "SKILL.md" -exec dirname {} \; | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "all-skills=$all" >> "$GITHUB_OUTPUT"
          echo "count=$(echo $all | jq length)" >> "$GITHUB_OUTPUT"

          # Split all skills into chunks of 8 for batched review jobs
          chunks=$(echo "$all" | jq -c '[range(0; length; 8) as $i | .[$i:$i+8]]')
          echo "skill-chunks=$chunks" >> "$GITHUB_OUTPUT"

          eval_skills=$(find plugins community-plugins -name "SKILL.md" -exec dirname {} \; | sort -u | while read -r d; do [ -d "$d/evals" ] && echo "$d"; done | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "eval-skills=$eval_skills" >> "$GITHUB_OUTPUT"
          echo "eval-count=$(echo $eval_skills | jq length)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "Found ${{ steps.discover.outputs.count }} skills (${{ steps.discover.outputs.eval-count }} with evals)"

  review:
    needs: [discover]
    if: needs.discover.outputs.count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.discover.outputs.skill-chunks) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Tessl
        uses: tesslio/setup-tessl@v2

      - name: Review skills in chunk
        continue-on-error: true
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_PROXY_URL }}
          PASS_THRESHOLD: ${{ env.PASS_THRESHOLD }}
        run: |
          mkdir -p /tmp/review-results

          for skill in $(echo '${{ toJSON(matrix.chunk) }}' | jq -r '.[]'); do
            skill_name=$(basename "$skill")
            echo "::group::Review $skill_name"

            set +e
            output=$(tessl skill review "$skill" --threshold "$PASS_THRESHOLD" 2>&1)
            review_exit=$?
            set -e
            echo "$output"

            # Parse validation checks result
            validation=$(echo "$output" | grep -oP 'Overall: \K(PASSED|FAILED)')
            errors=$(echo "$output" | grep -oP '\d+(?= errors)')
            warnings=$(echo "$output" | grep -oP '\d+(?= warnings)')

            # Parse judge evaluation result
            score=$(echo "$output" | grep -oP 'Review Score: \K\d+')
            description=$(echo "$output" | grep -oP '(?<=Description: )\d+')
            content=$(echo "$output" | grep -oP '(?<=Content: )\d+')

            # Extract validation checks block (everything before "Judge Evaluation")
            validation_block=$(echo "$output" | sed -n '/^Validation Checks/,/^Judge Evaluation/{ /^Judge Evaluation/d; p }')

            # Extract judge evaluation block (everything between "Judge Evaluation" and "Review Score")
            judge_block=$(echo "$output" | sed -n '/^Judge Evaluation/,/^Review Score/{ /^Judge Evaluation/d; /^Review Score/d; p }')

            printf '%s' "$validation_block" > /tmp/val_block.txt
            printf '%s' "$judge_block"      > /tmp/judge_block.txt

            jq -n \
              --arg  skill       "$skill_name" \
              --arg  validation  "$validation" \
              --arg  errors      "$errors" \
              --arg  warnings    "$warnings" \
              --arg  score       "$score" \
              --arg  description "$description" \
              --arg  content     "$content" \
              --rawfile val_block   /tmp/val_block.txt \
              --rawfile judge_block /tmp/judge_block.txt \
              '{
                skill:            $skill,
                validation:       $validation,
                errors:           $errors,
                warnings:         $warnings,
                review_score:     $score,
                description:      $description,
                content:          $content,
                validation_block: $val_block,
                judge_block:      $judge_block
              }' \
              > "/tmp/review-results/${skill_name}.json"

            echo "::endgroup::"
          done

      - name: Upload review JSONs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: review-result--chunk-${{ strategy.job-index }}
          path: /tmp/review-results/
          retention-days: 1

  evaluate:
    needs: [list-models, discover]
    if: needs.discover.outputs.eval-count > 0 && needs.list-models.outputs.count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.discover.outputs.eval-skills) }}
        model: ${{ fromJSON(needs.list-models.outputs.models) }}
        mode: [skill, baseline]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Derive skill name
        id: skill-name
        run: echo "value=$(basename '${{ matrix.skill }}')" >> "$GITHUB_OUTPUT"

      - name: Evaluate skill
        id: evaluate
        uses: yongsinp/skill-eval-action@feature/model_change
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_PROXY_URL }}
        with:
          skill-name: ${{ steps.skill-name.outputs.value }}
          skill-path: ${{ matrix.skill }}
          anthropic-api-key: ${{ secrets.LITELLM_API_KEY }}
          model: ${{ matrix.model }}
          pass-threshold: ${{ env.PASS_THRESHOLD }}
          upload-viewer: 'true'
          post-comment: 'false'
          write-summary: 'false'
          baseline: ${{ matrix.mode == 'baseline' }}

      - name: Save eval JSON
        if: always()
        env:
          PASS_RATE: ${{ steps.evaluate.outputs.pass-rate }}
          PASSED: ${{ steps.evaluate.outputs.passed }}
          TOTAL: ${{ steps.evaluate.outputs.total }}
        run: |
          skill_name='${{ steps.skill-name.outputs.value }}'
          model_name='${{ matrix.model }}'
          mode='${{ matrix.mode }}'
          safe_model=$(echo "$model_name" | tr '/: ' '---')
          mkdir -p /tmp/eval-results

          pass_rate="${PASS_RATE}"
          passed="${PASSED}"
          total="${TOTAL}"

          # Read token usage and per-case results from summary.json
          summary_file="$RUNNER_TEMP/skill-eval/${skill_name}/summary.json"
          if [ -f "$summary_file" ]; then
            total_tokens=$(jq -r '.total_tokens // ""' "$summary_file")
            total_time=$(jq -r '.total_time // ""' "$summary_file")
            results=$(jq -c '.results // []' "$summary_file")
          else
            total_tokens=''
            total_time=''
            results='[]'
          fi

          jq -n \
            --arg skill        "$skill_name" \
            --arg model        "$model_name" \
            --arg mode         "$mode" \
            --arg pass_rate    "$pass_rate" \
            --arg passed       "$passed" \
            --arg total        "$total" \
            --arg total_tokens "$total_tokens" \
            --arg total_time   "$total_time" \
            --argjson results  "$results" \
            '{
              skill:        $skill,
              model:        $model,
              mode:         $mode,
              pass_rate:    $pass_rate,
              passed:       $passed,
              total:        $total,
              total_tokens: $total_tokens,
              total_time:   $total_time,
              results:      $results
            }' \
            > "/tmp/eval-results/${skill_name}__${safe_model}__${mode}.json"

      - name: Upload eval JSON
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eval-result--${{ steps.skill-name.outputs.value }}--${{ matrix.model }}--${{ matrix.mode }}
          path: /tmp/eval-results/
          retention-days: 1

  summarize:
    needs: [review, evaluate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all review JSONs
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: review-result--*
          path: /tmp/all-reviews
          merge-multiple: true

      - name: Download all eval JSONs
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: eval-result--*
          path: /tmp/all-evals
          merge-multiple: true

      - name: Render merged summaries
        run: |
          review_files=$(find /tmp/all-reviews -name '*.json' 2>/dev/null | sort)
          eval_files=$(find /tmp/all-evals   -name '*.json' 2>/dev/null | sort)

          if [ -z "$review_files" ] && [ -z "$eval_files" ]; then
            echo "No evaluation results found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Build merged arrays (empty array fallback if no files)
          if [ -n "$review_files" ]; then
            reviews=$(echo "$review_files" | xargs jq -s '.')
          else
            reviews='[]'
          fi
          if [ -n "$eval_files" ]; then
            evals=$(echo "$eval_files" | xargs jq -s '.')
          else
            evals='[]'
          fi

          # Get unique skill names across both sets
          skills=$(printf '%s\n%s' \
            "$(echo "$reviews" | jq -r '.[].skill')" \
            "$(echo "$evals"   | jq -r '.[].skill')" \
            | sort -u | grep -v '^$')

          {
            echo "# Evaluation Summary"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$skills" | while IFS= read -r skill; do
            review_row=$(echo "$reviews" | jq --arg s "$skill" 'map(select(.skill == $s)) | first // {}')
            skill_evals=$(echo "$evals"  | jq --arg s "$skill" '[.[] | select(.skill == $s)]')
            models=$(echo "$skill_evals" | jq -r '.[].model' | sort -u)

            val=$(echo "$review_row"      | jq -r '.validation    // ""')
            errors=$(echo "$review_row"   | jq -r '.errors        // ""')
            warnings=$(echo "$review_row" | jq -r '.warnings      // ""')
            rev_score=$(echo "$review_row"| jq -r '.review_score  // ""')
            desc=$(echo "$review_row"     | jq -r '.description   // ""')
            content=$(echo "$review_row"  | jq -r '.content       // ""')
            val_block=$(echo "$review_row"| jq -r '.validation_block // ""')
            judge_block=$(echo "$review_row"| jq -r '.judge_block // ""')

            if [ "$val" = "PASSED" ]; then val_status="✅ PASSED"; else val_status="❌ FAILED"; fi
            if [ -n "$rev_score" ] && [ "$rev_score" -ge "$PASS_THRESHOLD" ] 2>/dev/null; then
              judge_status="✅ PASSED"
            else
              judge_status="❌ FAILED"
            fi

            {
              echo "---"
              echo ""
              echo "# ${skill}"
              echo ""

              # ── Validation Checks (once per skill) ───────────────────────
              echo "## ${val_status} Validation Checks"
              echo ""
              echo "Errors: ${errors} | Warnings: ${warnings}"
              echo ""
              echo "<details><summary>Validation Checks detail</summary>"
              echo ""
              echo '```'
              echo "$val_block"
              echo '```'
              echo "</details>"
              echo ""

              # ── LLM Judge Evaluation (once per skill) ────────────────────
              echo "## ${judge_status} LLM Judge Evaluation"
              echo ""
              echo "**Score: ${rev_score}%**"
              echo ""
              echo "| Check | Score |"
              echo "|-------|-------|"
              echo "| Description | ${desc}% |"
              echo "| Content | ${content}% |"
              echo ""
              echo "<details><summary>Judge Evaluation detail</summary>"
              echo ""
              echo '```'
              echo "$judge_block"
              echo '```'
              echo "</details>"
              echo ""

              # ── Eval Results table ───────────────────────────────────────
              echo "## 📊 Eval Results"
              echo ""

              if [ -n "$models" ]; then
                echo "| Model | Skill | Baseline | Δ | Tokens Used (skill) |"
                echo "|-------|:-----:|:--------:|:-:|--------------------:|"
                echo "$models" | while IFS= read -r model; do
                  skill_row=$(echo "$skill_evals" | jq -r --arg m "$model" --arg mode "skill"    '.[] | select(.model == $m and .mode == $mode)')
                  base_row=$(echo "$skill_evals"  | jq -r --arg m "$model" --arg mode "baseline" '.[] | select(.model == $m and .mode == $mode)')

                  skill_rate=$(echo "$skill_row" | jq -r '.pass_rate    // ""')
                  skill_pass=$(echo "$skill_row" | jq -r '.passed       // ""')
                  skill_tot=$(echo "$skill_row"  | jq -r '.total        // ""')
                  base_rate=$(echo "$base_row"   | jq -r '.pass_rate    // ""')
                  base_pass=$(echo "$base_row"   | jq -r '.passed       // ""')
                  base_tot=$(echo "$base_row"    | jq -r '.total        // ""')
                  total_tokens=$(echo "$skill_row" | jq -r '.total_tokens // ""')

                  # Skill cell
                  if [ -n "$skill_rate" ] && [ "$skill_rate" != "" ]; then
                    if awk "BEGIN {exit !($skill_rate >= $PASS_THRESHOLD)}"; then
                      skill_cell="✅ ${skill_rate}% (${skill_pass}/${skill_tot})"
                    else
                      skill_cell="❌ ${skill_rate}% (${skill_pass}/${skill_tot})"
                    fi
                  else
                    skill_cell="—"
                  fi

                  # Baseline cell
                  if [ -n "$base_rate" ] && [ "$base_rate" != "" ]; then
                    if awk "BEGIN {exit !($base_rate >= $PASS_THRESHOLD)}"; then
                      base_cell="✅ ${base_rate}% (${base_pass}/${base_tot})"
                    else
                      base_cell="❌ ${base_rate}% (${base_pass}/${base_tot})"
                    fi
                  else
                    base_cell="—"
                  fi

                  # Delta cell
                  if [ -n "$skill_rate" ] && [ -n "$base_rate" ] && [ "$skill_rate" != "" ] && [ "$base_rate" != "" ]; then
                    delta=$(awk "BEGIN {printf \"%.1f\", $skill_rate - $base_rate}")
                    if awk "BEGIN {exit !($delta > 0)}"; then
                      delta_cell="+${delta}pp"
                    elif awk "BEGIN {exit !($delta < 0)}"; then
                      delta_cell="${delta}pp"
                    else
                      delta_cell="0pp"
                    fi
                  else
                    delta_cell="—"
                  fi

                  # Token cell
                  if [ -n "$total_tokens" ] && [ "$total_tokens" != "" ]; then
                    token_cell=$(printf '%s' "$total_tokens" | sed ':a;s/\B[0-9]\{3\}\b/,&/;ta')
                  else
                    token_cell="—"
                  fi

                  echo "| \`${model}\` | ${skill_cell} | ${base_cell} | ${delta_cell} | ${token_cell} |"
                done
              else
                echo "No evals"
              fi

              echo ""

              # ── Per-model eval detail ────────────────────────────────────
              if [ -n "$models" ]; then
                echo "$models" | while IFS= read -r model; do
                  skill_row=$(echo "$skill_evals" | jq -r --arg m "$model" --arg mode "skill"    '.[] | select(.model == $m and .mode == $mode)')
                  base_row=$(echo "$skill_evals"  | jq -r --arg m "$model" --arg mode "baseline" '.[] | select(.model == $m and .mode == $mode)')
                  skill_rate=$(echo "$skill_row" | jq -r '.pass_rate // ""')
                  skill_pass=$(echo "$skill_row" | jq -r '.passed    // ""')
                  skill_tot=$(echo "$skill_row"  | jq -r '.total     // ""')
                  skill_tokens=$(echo "$skill_row" | jq -r '.total_tokens // ""')
                  skill_time=$(echo "$skill_row"   | jq -r '.total_time   // ""')

                  if [ -n "$skill_rate" ] && [ "$skill_rate" != "" ]; then
                    eval_header="${skill_rate}% (${skill_pass}/${skill_tot})"
                  else
                    eval_header="No evals"
                  fi

                  echo "### \`${model}\`: ${eval_header}"
                  echo ""

                  # Helper to render a case breakdown table for a given row
                  render_case_table() {
                    local row="$1" label="$2"
                    local rate pass tot tokens time n
                    rate=$(echo "$row"   | jq -r '.pass_rate    // ""')
                    pass=$(echo "$row"   | jq -r '.passed       // ""')
                    tot=$(echo "$row"    | jq -r '.total        // ""')
                    tokens=$(echo "$row" | jq -r '.total_tokens // ""')
                    time=$(echo "$row"   | jq -r '.total_time   // ""')
                    n=$(echo "$row"      | jq -r '.results // [] | length')

                    if [ "$n" -gt 0 ] 2>/dev/null; then
                      local token_fmt="—"
                      if [ -n "$tokens" ] && [ "$tokens" != "" ]; then
                        token_fmt=$(printf '%s' "$tokens" | sed ':a;s/\B[0-9]\{3\}\b/,&/;ta')
                      fi
                      echo "**${label} — Pass rate: ${pass}/${tot} (${rate}%)** | Time: ${time:-—}s | Tokens: ${token_fmt}"
                      echo ""
                      echo "| # | Case | Status | Criteria | Time | Tokens |"
                      echo "|---|------|--------|:--------:|-----:|-------:|"
                      echo "$row" | jq -r '.results[] | [
                        .name,
                        (if .criteria_passed == .criteria_total and .status == "completed" then "PASS" else "FAIL" end),
                        "\(.criteria_passed)/\(.criteria_total)",
                        "\(.elapsed)s",
                        (.tokens | tostring)
                      ] | @tsv' | awk -F'\t' 'BEGIN{i=1} {
                        status = ($2 == "PASS") ? "PASS" : "FAIL"
                        printf "| %d | %s | %s | %s | %s | %s |\n", i, $1, status, $3, $4, $5
                        i++
                      }'
                      echo ""
                    fi
                  }

                  render_case_table "$skill_row" "Skill"
                  render_case_table "$base_row"  "Baseline"
                done
              fi

            } >> "$GITHUB_STEP_SUMMARY"
          done
